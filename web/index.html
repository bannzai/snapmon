<!DOCTYPE html>
<html>
<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="撮った写真の被写体がモンスターになってバトルするゲーム">

  <!--
    SNS がこの URL のカードを作る時に読むタグ。文と画像は LP (docs/index.html) と同じにし、画像は LP が配信しているものを指す
    (web/ に複製すると、絵柄を変える時に 2 か所を直すことになるため)。LP と揃っていることは test/web/social_card_meta_tags_test.dart が確かめる
  -->
  <meta property="og:type" content="website">
  <meta property="og:site_name" content="SnapMonster">
  <meta property="og:title" content="SnapMonster | 撮った写真がモンスターになるバトルゲーム">
  <meta property="og:description" content="身の回りの物を撮ると、その物に似た自分だけのモンスターが生まれる。ターン制バトルで集めて、戦わせて、見せ合おう。">
  <meta property="og:url" content="https://play.snapmonster.app/">
  <meta property="og:image" content="https://snapmonster.app/og.png">
  <meta property="og:image:width" content="1200">
  <meta property="og:image:height" content="630">
  <meta property="og:locale" content="ja_JP">
  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:title" content="SnapMonster | 撮った写真がモンスターになるバトルゲーム">
  <meta name="twitter:description" content="身の回りの物を撮ると、その物に似た自分だけのモンスターが生まれる。ターン制バトルで集めて、戦わせて、見せ合おう。">
  <meta name="twitter:image" content="https://snapmonster.app/og.png">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="SnapMonster">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>SnapMonster</title>
  <link rel="manifest" href="manifest.json">
</head>
<body>
  <!--
    You can customize the "flutter_bootstrap.js" script.
    This is useful to provide a custom configuration to the Flutter loader
    or to give the user feedback during the initialization process.

    For more details:
    * https://docs.flutter.dev/platform-integration/web/initialization
  -->
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
