name: firebase-ci

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

on:
  push:
    branches:
      - main
  pull_request:

# job が GITHUB_TOKEN を使うのは checkout だけのため、読み取り専用に絞る
permissions:
  contents: read

jobs:
  # Functions のビルドと単体テスト、Emulator 上の Security Rules と匿名ログイン → confirmAge・generate のテスト
  functions:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: functions
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        persist-credentials: false
    - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
      with:
        # functions/package.json の engines.node に合わせる
        node-version: '22'
        cache: npm
        cache-dependency-path: functions/package-lock.json
    # Firestore・Storage の Emulator は Java 21 以上を要求する (firebase-tools の要件)
    - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
      with:
        distribution: temurin
        java-version: '21'
    - run: npm ci
    # 被写体の切り出しのモデル (178 MB) を、取得元とハッシュを固定したスクリプトの内容をキーにして使い回す (documents/adr/0002-subject-cutout-and-generation-cost.md)
    - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: functions/models
        key: segmentation-model-${{ hashFiles('functions/scripts/fetch-segmentation-model.mjs') }}
    - run: npm run fetch-model
    - run: npm run build
    - run: npm test
    - run: npm run test:emulator
