name: battle-simulation

# CPU の強さのシミュレーション (tool/simulate_battles.dart) を実行し、利用者の勝率・ラウンド数・1 ダメージの割合の表を
# job の出力と成果物 (artifact) に残す。開発用の Mac ではバトルの計算を何千戦も回さない (CLAUDE.md「ビルド・テスト・検証方法」) ため、
# CPU のダメージ・最大 HP の割合を決め直す時にここで実行して結果を読む (issue #267)。

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

on:
  # バトルの計算・見本のモンスター・シミュレーションを変えた PR では既定の条件で実行し、勝率の変化を PR の run で読めるようにする
  # (workflow_dispatch だけの workflow は main に入るまで dispatch できないため、PR からも動かす)
  pull_request:
    paths:
      - lib/domain/battle/**
      - lib/domain/monster/**
      - assets/samples/sample_monsters.json
      - tool/simulate_battles.dart
      - .github/workflows/battle-simulation.yml
  # 入力の既定値は tool/simulate_battles.dart の定数が持つ。空のまま dispatch するとその値で実行する
  workflow_dispatch:
    inputs:
      seeds:
        description: 利用者 1 体 × CPU 1 体の組ごとの乱数の数 (空ならツールの既定)
      damage_percents:
        description: 試す CPU のダメージの割合 (%) の一覧 (カンマ区切り。空ならツールの既定)
      hit_points_percents:
        description: 試す CPU の最大 HP の割合 (%) の一覧 (カンマ区切り。空ならツールの既定)

# job が GITHUB_TOKEN を使うのは checkout だけのため、読み取り専用に絞る
permissions:
  contents: read

jobs:
  simulate:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        persist-credentials: false
    - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
      with:
        flutter-version-file: pubspec.yaml
        channel: stable
    - run: flutter pub get
    - run: mkdir -p tmp
    # tee で繋ぐとツールの失敗が exit 0 に隠れるため、ファイルに書いてから表示する
    - run: dart run tool/simulate_battles.dart --seeds "$SEEDS" --damage-percents "$DAMAGE_PERCENTS" --hit-points-percents "$HIT_POINTS_PERCENTS" > tmp/battle-simulation.md
      # pull_request では inputs が無く空の値になり、ツールは空の値を省略として扱う
      env:
        SEEDS: ${{ inputs.seeds }}
        DAMAGE_PERCENTS: ${{ inputs.damage_percents }}
        HIT_POINTS_PERCENTS: ${{ inputs.hit_points_percents }}
    - run: cat tmp/battle-simulation.md
    - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
      with:
        name: battle-simulation
        path: tmp/battle-simulation.md
        if-no-files-found: error
