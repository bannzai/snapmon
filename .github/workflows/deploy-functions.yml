name: deploy-functions

# Functions と、それが前提にする Firestore・Storage の Security Rules・インデックスを snapmon-prod へデプロイする。
# 本番への配布は、触れる版を見て公開に進むと決めてもらうまで手動実行 (workflow_dispatch) だけにする (ADR 0001 の Web 版のホスティングの行と同じ方針)。
#
# 認証: 鍵を持たず、GitHub の OIDC トークンを Workload Identity Federation でデプロイ専用サービスアカウント
# (github-firebase-deployer@snapmon-prod.iam.gserviceaccount.com) の短命なトークンに交換する。
# GCP 側の前提と environment firebase-prod を付ける理由は .claude/rules/firebase-deploy.md。
# master の投入 (master_file) には、同じサービスアカウントに Firestore への書き込み (roles/datastore.user) が要る。
# Functions は実行サービスアカウント snapmon-functions で動く (functions/src/index.ts) ため、同じサービスアカウントに snapmon-functions の actAs (roles/iam.serviceAccountUser) が要る。

on:
  workflow_dispatch:
    inputs:
      targets:
        description: 'firebase deploy --only に渡す対象 (例: functions:healthCheck)'
        required: true
        type: string
        default: 'functions,firestore,storage'
      master_file:
        description: '投入する master の JSON (リポジトリ内のパス)。空なら投入しない'
        required: false
        type: string
      master_version:
        description: 'master_file を投入する版番号 (1 以上の整数。投入済みの版は書き換えない)'
        required: false
        type: string

# 半端な状態を避けるため、デプロイは同時に 1 本だけ実行する (実行中はキャンセルせず待機させる)
concurrency:
  group: deploy-firebase
  cancel-in-progress: false

# id-token は Workload Identity Federation に渡す OIDC トークンの発行に要る
permissions:
  contents: read
  id-token: write

env:
  PROJECT_ID: snapmon-prod

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: firebase-prod
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        persist-credentials: false
    - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
      with:
        # functions/package.json の engines.node に合わせる
        node-version: '22'
        cache: npm
        cache-dependency-path: functions/package-lock.json
    - name: Install dependencies
      working-directory: functions
      run: npm ci
    # npm ci の後に置く。依存の lifecycle script が資格情報を読めないようにするため。
    # external_account 形式の資格情報ファイルを GOOGLE_APPLICATION_CREDENTIALS に出し、firebase-tools が Application Default Credentials として読む
    - name: Authenticate to Google Cloud
      uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3.0.0
      with:
        project_id: ${{ env.PROJECT_ID }}
        workload_identity_provider: projects/1032186168570/locations/global/workloadIdentityPools/github/providers/snapmon
        service_account: github-firebase-deployer@snapmon-prod.iam.gserviceaccount.com
        create_credentials_file: true
        export_environment_variables: true
    - name: Deploy
      working-directory: functions
      env:
        DEPLOY_TARGETS: ${{ inputs.targets }}
      run: npx firebase deploy --only "$DEPLOY_TARGETS" --project "$PROJECT_ID" --non-interactive
    - name: Seed master
      if: inputs.master_file != ''
      working-directory: functions
      env:
        MASTER_FILE: ${{ inputs.master_file }}
        MASTER_VERSION: ${{ inputs.master_version }}
      run: npm run seed-master -- --project "$PROJECT_ID" --version "$MASTER_VERSION" --file "$GITHUB_WORKSPACE/$MASTER_FILE"
