name: deploy-functions

# Functions と、それが前提にする Firestore・Storage の Security Rules・インデックスを snapmon-prod へデプロイする。
# 本番への配布は、触れる版を見て公開に進むと決めてもらうまで手動実行 (workflow_dispatch) だけにする (ADR 0001 の Web 版のホスティングの行と同じ方針)。
#
# 認証: デプロイ専用サービスアカウント (github-firebase-deployer@snapmon-prod.iam.gserviceaccount.com) の鍵 (JSON) を base64 にした
# Secret FIREBASE_SERVICE_ACCOUNT_BASE64 を Application Default Credentials として復元する。
# サービスアカウントの IAM は /firebase-functions-deploy-iam-setup skill で揃える。
# master の投入 (master_file) には、同じサービスアカウントに Firestore への書き込み (roles/datastore.user) が要る。

on:
  workflow_dispatch:
    inputs:
      targets:
        description: 'firebase deploy --only に渡す対象 (例: functions:healthCheck)'
        required: true
        type: string
        default: 'functions,firestore,storage'
      master_file:
        description: '投入する master の JSON (リポジトリ内のパス)。空なら投入しない'
        required: false
        type: string
      master_version:
        description: 'master_file を投入する版番号 (1 以上の整数。投入済みの版は書き換えない)'
        required: false
        type: string

# 半端な状態を避けるため、デプロイは同時に 1 本だけ実行する (実行中はキャンセルせず待機させる)
concurrency:
  group: deploy-firebase
  cancel-in-progress: false

# リポジトリの読み取りだけ。デプロイの認証はサービスアカウントの鍵で行う
permissions:
  contents: read

env:
  PROJECT_ID: snapmon-prod

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        persist-credentials: false
    - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
      with:
        # functions/package.json の engines.node に合わせる
        node-version: '22'
        cache: npm
        cache-dependency-path: functions/package-lock.json
    - name: Install dependencies
      working-directory: functions
      run: npm ci
    - name: Restore service account key
      env:
        FIREBASE_SERVICE_ACCOUNT_BASE64: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_BASE64 }}
      run: |
        if [ -z "$FIREBASE_SERVICE_ACCOUNT_BASE64" ]; then
          echo "::error::Secret FIREBASE_SERVICE_ACCOUNT_BASE64 が未登録です"
          exit 1
        fi
        key_path="$RUNNER_TEMP/firebase-deployer.json"
        echo "$FIREBASE_SERVICE_ACCOUNT_BASE64" | base64 --decode > "$key_path"
        echo "GOOGLE_APPLICATION_CREDENTIALS=$key_path" >> "$GITHUB_ENV"
    - name: Deploy
      working-directory: functions
      env:
        DEPLOY_TARGETS: ${{ inputs.targets }}
      run: npx firebase deploy --only "$DEPLOY_TARGETS" --project "$PROJECT_ID" --non-interactive
    - name: Seed master
      if: inputs.master_file != ''
      working-directory: functions
      env:
        MASTER_FILE: ${{ inputs.master_file }}
        MASTER_VERSION: ${{ inputs.master_version }}
      run: npm run seed-master -- --project "$PROJECT_ID" --version "$MASTER_VERSION" --file "$GITHUB_WORKSPACE/$MASTER_FILE"
