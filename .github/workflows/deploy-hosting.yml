name: deploy-hosting

# Web 版をビルドして snapmon-prod の Firebase Hosting へデプロイする。
# 本番への配布は、触れる版を見て公開に進むと決めてもらうまで手動実行 (workflow_dispatch) だけにする (ADR 0001 の Web 版のホスティングの行)。
# 認証: deploy-functions.yml と同じく鍵を持たず、GitHub の OIDC トークンを Workload Identity Federation でデプロイ専用サービスアカウント
# (github-firebase-deployer@snapmon-prod.iam.gserviceaccount.com) の短命なトークンに交換する。Hosting のデプロイの権限は同じサービスアカウントの roles/firebase.admin が持つ。
# GCP 側の前提と environment firebase-prod を付ける理由は .claude/rules/firebase-deploy.md。
# Web の App Check に使う reCAPTCHA Enterprise のサイトキーは公開値のため、リポジトリの Variable RECAPTCHA_ENTERPRISE_SITE_KEY から渡す。

on:
  workflow_dispatch:

concurrency:
  group: deploy-firebase
  cancel-in-progress: false

# id-token は Workload Identity Federation に渡す OIDC トークンの発行に要る
permissions:
  contents: read
  id-token: write

# flutter-ci.yml の FLUTTER_VERSION と同じ版にする
env:
  FLUTTER_VERSION: '3.41.9'
  PROJECT_ID: snapmon-prod

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: firebase-prod
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        persist-credentials: false
    - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
      with:
        channel: stable
        flutter-version: ${{ env.FLUTTER_VERSION }}
    - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
      with:
        # functions/package.json の engines.node に合わせる (firebase-tools を functions の devDependencies から使うため)
        node-version: '22'
        cache: npm
        cache-dependency-path: functions/package-lock.json
    # Firebase の設定ファイルは git の管理外のため、ビルドの前に Secrets から書き出す
    - run: scripts/restore-firebase-config.sh dart
      env:
        FIREBASE_OPTIONS_DART_B64: ${{ secrets.FIREBASE_OPTIONS_DART_B64 }}
    - run: flutter pub get
    - name: Build web
      env:
        RECAPTCHA_ENTERPRISE_SITE_KEY: ${{ vars.RECAPTCHA_ENTERPRISE_SITE_KEY }}
      run: flutter build web --release --dart-define=RECAPTCHA_ENTERPRISE_SITE_KEY="$RECAPTCHA_ENTERPRISE_SITE_KEY"
    # --ignore-scripts: id-token: write は job 全体に効き、依存の lifecycle script が OIDC トークンを発行できるため、install script を実行しない。
    # functions/package-lock.json で install script を持つのは @firebase/util・fsevents・onnxruntime-node・protobufjs・re2 で、firebase-tools 自身は持たない (re2 は superstatic の optionalDependencies)
    - name: Install firebase-tools
      working-directory: functions
      run: npm ci --ignore-scripts
    # npm ci の後に置く。資格情報のファイルを依存のコードに読ませないため (deploy-functions.yml と同じ)
    - name: Authenticate to Google Cloud
      uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3.0.0
      with:
        project_id: ${{ env.PROJECT_ID }}
        workload_identity_provider: projects/1032186168570/locations/global/workloadIdentityPools/github/providers/snapmon
        service_account: github-firebase-deployer@snapmon-prod.iam.gserviceaccount.com
        create_credentials_file: true
        export_environment_variables: true
    - name: Deploy
      working-directory: functions
      run: npx firebase deploy --only hosting --project "$PROJECT_ID" --non-interactive
