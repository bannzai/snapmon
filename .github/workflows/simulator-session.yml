# iOS Simulator セッションを張る caller workflow。実体は bannzai/simtunnel の session.yml（reusable workflow）。
# 参照: https://github.com/bannzai/simtunnel の PROJECT.md「各アプリ repo での実行」
name: simulator-session
# run-name は local/simtunnel CLI が run を特定するキーのためこの形式を維持する
run-name: "session=${{ inputs.session }} device=${{ inputs.device }}"

on:
  workflow_dispatch: # fork PR に Secrets を渡さないため workflow_dispatch のみ
    # session / device / duration_minutes は local/simtunnel の up が常に送るため宣言必須
    # （未定義の input を送ると dispatch が拒否される）
    inputs:
      session:
        description: "セッション名。tailnet ホスト名 simtunnel-<session> になる（小文字英数字とハイフンのみ）"
        required: true
        default: snapmon
      device:
        description: "Simulator のデバイス名"
        required: true
        default: iPhone 17
      duration_minutes:
        description: "セッション維持時間（分）"
        required: true
        default: "60"
      serve_sim:
        description: "serve-sim (ブラウザ preview) を起動する。runner のメモリに余裕を持たせたい時は false"
        required: false
        default: "true"

jobs:
  # Simulator 用 .app (debug) をビルドして artifact に上げる
  build:
    runs-on: macos-26
    timeout-minutes: 30
    permissions:
      contents: read # checkout のみ。OIDC token (id-token) は session job だけに与える
    steps:
      # simtunnel 経路の workflow は uses を commit SHA で固定する（simtunnel PROJECT.md「リポジトリ公開に耐える安全性」）
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          channel: stable
          flutter-version: '3.41.9' # flutter-ci.yml の FLUTTER_VERSION と揃える
      - run: flutter pub get
      - run: flutter build ios --simulator --debug
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: simulator-app
          path: build/ios/iphonesimulator # .app の親ディレクトリ（.app 直指定は中身が flatten される）

  session:
    needs: build
    # id-token: write が必要なのは reusable workflow を呼ぶこの job だけのため、job 単位で最小権限にする
    permissions:
      id-token: write # Tailscale の OIDC (workload identity federation) 認証に必要
      contents: read
    # タグ運用はしないため main の commit SHA で固定する（更新時は SHA を書き換える）
    uses: bannzai/simtunnel/.github/workflows/session.yml@f1cb26f32066774564c1450202a6a10fa79635fb # main 2026-10-16
    with:
      session: ${{ inputs.session }}
      device: ${{ inputs.device }}
      duration_minutes: ${{ inputs.duration_minutes }}
      serve_sim: ${{ inputs.serve_sim }}
      app_artifact: simulator-app
    secrets:
      TS_OIDC_CLIENT_ID: ${{ secrets.TS_OIDC_CLIENT_ID }}
      TS_OIDC_AUDIENCE: ${{ secrets.TS_OIDC_AUDIENCE }}
