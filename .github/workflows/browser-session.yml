# Web 版を GitHub Actions の Linux Runner の Chromium で開く caller workflow。実体は bannzai/webtunnel の session.yml（reusable workflow）。
# 参照: https://github.com/bannzai/webtunnel の PROJECT.md「各アプリ repo での実行（reusable workflow）」
name: browser-session
# run-name は local/webtunnel CLI が run を特定するキーのためこの形式を維持する
run-name: "session=${{ inputs.session }} duration=${{ inputs.duration_minutes }}m"
on:
  workflow_dispatch: # fork PR に Secrets を渡さないため workflow_dispatch のみ
    # session / duration_minutes は local/webtunnel の up が常に送るため宣言必須
    # （未定義の input を送ると dispatch が拒否される）
    inputs:
      session:
        required: true
        default: snapmon
      duration_minutes:
        required: true
        default: "60"
      start_url:
        required: false
        default: "" # 空なら dev サーバの URL を開く（session.yml 側の既定に合わせる）
      record:
        required: false
        default: "true"
      preview:
        required: false
        default: "true"
      setup_script:
        required: false
        default: ".webtunnel/setup.sh"
      software_webgl:
        required: false
        # Flutter Web の描画 (CanvasKit) は WebGL を使うため、runner の Chromium では既定で有効にする
        default: "true"
      flutter_build_mode:
        # 開発者メニュー (DEBUG ビルド限定) の「ログインせずに使う」と見本の生成で確かめる時は debug にする。
        # local/webtunnel の up はこの input を送らないため、debug は gh workflow run -f flutter_build_mode=debug で起動する
        description: "flutter build web のモード (release / debug)"
        required: false
        type: choice
        options:
          - release
          - debug
        default: release
jobs:
  session:
    permissions:
      id-token: write # Tailscale の OIDC (workload identity federation) 認証に必要
      contents: read
    # タグ運用はしないため main の commit SHA で固定する（更新時は SHA を書き換える）
    uses: bannzai/webtunnel/.github/workflows/session.yml@caa3cecd4987f8f7bc70e17ba3e1e18cf37aacf8 # main 2026-10-22 (WEBTUNNEL_SETUP_ENV 対応)
    with:
      session: ${{ inputs.session }}
      duration_minutes: ${{ inputs.duration_minutes }}
      start_url: ${{ inputs.start_url }}
      record: ${{ inputs.record }}
      preview: ${{ inputs.preview }}
      setup_script: ${{ inputs.setup_script }}
      software_webgl: ${{ inputs.software_webgl }}
      # ubuntu-latest に Flutter は入っていないため、flutter-ci.yml の FLUTTER_VERSION (3.41.9) を取得して web をビルドする。
      # タグは書き換えられ得るため、3.41.9 タグが指す commit (git ls-remote で確認) の SHA と一致する時だけ使う。
      # flutter_tools はタグから自分のバージョンを求め、タグが無いと 0.0.0-unknown になって pubspec の SDK 制約を満たせないため、タグごと取得する
      # lib/firebase_options.dart は git の管理外のため、secret WEBTUNNEL_SETUP_ENV が運ぶ FIREBASE_OPTIONS_DART_B64 から書き出す (.claude/rules/firebase-config-files.md)
      # App Check の Web の debug token (同じ secret の FIREBASE_APPCHECK_DEBUG_TOKEN_WEB) は debug ビルドにだけ渡す
      # (runner の Chromium は reCAPTCHA Enterprise のスコアが低く証明が通らないため。release の成果物に token を埋め込まない)
      setup_command: >-
        bash scripts/restore-firebase-config.sh dart &&
        git init -q "$RUNNER_TEMP/flutter" &&
        git -C "$RUNNER_TEMP/flutter" fetch -q --depth 1 https://github.com/flutter/flutter.git refs/tags/3.41.9:refs/tags/3.41.9 &&
        [ "$(git -C "$RUNNER_TEMP/flutter" rev-parse '3.41.9^{commit}')" = 00b0c91f06209d9e4a41f71b7a512d6eb3b9c694 ] &&
        git -C "$RUNNER_TEMP/flutter" checkout -q --detach 3.41.9 &&
        "$RUNNER_TEMP/flutter/bin/flutter" pub get &&
        "$RUNNER_TEMP/flutter/bin/flutter" build web --${{ inputs.flutter_build_mode }} --dart-define=RECAPTCHA_ENTERPRISE_SITE_KEY=${{ vars.RECAPTCHA_ENTERPRISE_SITE_KEY }}
        --dart-define=FIREBASE_APPCHECK_DEBUG_TOKEN_WEB="$([ "${{ inputs.flutter_build_mode }}" = debug ] && printf '%s' "${FIREBASE_APPCHECK_DEBUG_TOKEN_WEB:-}")"
      # webtunnel は dev サーバが 127.0.0.1 で listen していることを検証するため loopback に束縛する
      start_command: python3 -m http.server "$PORT" --bind 127.0.0.1 --directory build/web
      port: "8080"
    secrets:
      TS_OIDC_CLIENT_ID: ${{ secrets.TS_OIDC_CLIENT_ID }}
      TS_OIDC_AUDIENCE: ${{ secrets.TS_OIDC_AUDIENCE }}
      # setup_command にだけ渡る。登録は scripts/set-webtunnel-setup-env-secret.sh
      WEBTUNNEL_SETUP_ENV: ${{ secrets.WEBTUNNEL_SETUP_ENV }}
