name: flutter-ci

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

on:
  push:
    branches:
      - main
  pull_request:

# job が GITHUB_TOKEN を使うのは checkout だけのため、読み取り専用に絞る
permissions:
  contents: read

# Flutter の版は pubspec.yaml の environment: flutter: に書き、各 job は flutter-version-file で読む (手元の版は make flutter-version-check が比べる)
# Firebase の設定ファイルは git の管理外のため、各 job はビルドの前に scripts/restore-firebase-config.sh で Secrets から書き出す
env:
  FIREBASE_OPTIONS_DART_B64: ${{ secrets.FIREBASE_OPTIONS_DART_B64 }}
  GOOGLE_SERVICE_INFO_PLIST_B64: ${{ secrets.GOOGLE_SERVICE_INFO_PLIST_B64 }}
  GOOGLE_SERVICES_JSON_B64: ${{ secrets.GOOGLE_SERVICES_JSON_B64 }}

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        persist-credentials: false
    - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
      with:
        flutter-version-file: pubspec.yaml
        channel: stable
    - run: scripts/restore-firebase-config.sh dart
    - run: flutter pub get
    # UI の文言 (lib/l10n/app_*.arb) から AppLocalizations を生成する。生成物は git に入れないため、analyze の前に作る
    - run: flutter gen-l10n
    - run: flutter analyze --no-pub --no-fatal-infos --fatal-warnings
    - run: dart format --set-exit-if-changed lib test store_screenshots tool

  test:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        persist-credentials: false
    - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
      with:
        flutter-version-file: pubspec.yaml
        channel: stable
    - run: scripts/restore-firebase-config.sh dart
    - run: flutter pub get
    - run: flutter gen-l10n
    - run: flutter test
    - run: bash scripts/test/test-set-webtunnel-setup-env-secret.sh
    - run: bash scripts/test/test-restore-android-signing.sh
    - run: bash scripts/test/test-makefile-targets.sh
    - run: bash scripts/test/test-metadata-check.sh
    # docs/master-viewer.js は package.json の無いディレクトリの ES module で、拡張子 .js のまま読むには
    # module の構文の自動判別が既定で有効な Node 22 以降が要る (firebase-ci.yml と同じ版)
    - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
      with:
        node-version: '22'
    - run: node --test scripts/test/test-master-viewer.mjs

  build-web:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        persist-credentials: false
    - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
      with:
        flutter-version-file: pubspec.yaml
        channel: stable
    - run: scripts/restore-firebase-config.sh dart
    - run: flutter pub get
    # サイトキー (公開値) を付けて、本番の Hosting と同じ App Check の設定の成果物にする (deploy-hosting.yml と同じ)
    - run: flutter build web --release --dart-define=RECAPTCHA_ENTERPRISE_SITE_KEY="$RECAPTCHA_ENTERPRISE_SITE_KEY"
      env:
        RECAPTCHA_ENTERPRISE_SITE_KEY: ${{ vars.RECAPTCHA_ENTERPRISE_SITE_KEY }}
    # 手元のブラウザで release ビルドを試すための成果物 (gh run download <run ID> -n web-build -D tmp/web-build →
    # python3 -m http.server 8080 --bind 127.0.0.1 --directory tmp/web-build)。この Mac で flutter build を実行しないため (CLAUDE.md「ビルド・テスト・検証方法」)
    - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
      with:
        name: web-build
        path: build/web
        retention-days: 7

  build-android:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        persist-credentials: false
    - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
      with:
        distribution: temurin
        java-version: '17'
    - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
      with:
        flutter-version-file: pubspec.yaml
        channel: stable
    - run: scripts/restore-firebase-config.sh dart android
    - run: flutter pub get
    - run: flutter build apk --debug --dart-define=REVENUECAT_PUBLIC_API_KEY_ANDROID="$REVENUECAT_PUBLIC_API_KEY_ANDROID"
      env:
        REVENUECAT_PUBLIC_API_KEY_ANDROID: ${{ vars.REVENUECAT_PUBLIC_API_KEY_ANDROID }}

  # iOS のビルド (build-ios) は PR の CI では行わない。macOS ランナーの同時実行数の上限をアカウント内の他のリポジトリと
  # 共有していて、何時間も QUEUED のまま進まずマージを止めたため (2026-10-30 の bannzai の判断。CLAUDE.md「ビルド・テスト・検証方法」)。
  # iOS のビルドは simtunnel (simulator-session.yml) での動作確認とリリースの作業で確かめる
