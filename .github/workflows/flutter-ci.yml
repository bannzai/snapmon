name: flutter-ci

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

on:
  push:
    branches:
      - main
  pull_request:

# job が GITHUB_TOKEN を使うのは checkout だけのため、読み取り専用に絞る
permissions:
  contents: read

# ローカル開発の Flutter (3.41.9) と揃える。上げる時は simulator-session.yml / browser-session.yml も同じ値にする
env:
  FLUTTER_VERSION: '3.41.9'

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        persist-credentials: false
    - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
      with:
        channel: stable
        flutter-version: ${{ env.FLUTTER_VERSION }}
    - run: flutter pub get
    - run: flutter analyze --no-pub --no-fatal-infos --fatal-warnings
    - run: dart format --set-exit-if-changed lib test

  test:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        persist-credentials: false
    - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
      with:
        channel: stable
        flutter-version: ${{ env.FLUTTER_VERSION }}
    - run: flutter pub get
    - run: flutter test

  build-web:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        persist-credentials: false
    - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
      with:
        channel: stable
        flutter-version: ${{ env.FLUTTER_VERSION }}
    - run: flutter pub get
    - run: flutter build web --release

  build-android:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        persist-credentials: false
    - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
      with:
        distribution: temurin
        java-version: '17'
    - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
      with:
        channel: stable
        flutter-version: ${{ env.FLUTTER_VERSION }}
    - run: flutter pub get
    - run: flutter build apk --debug

  # public リポジトリのため GitHub-hosted の macOS ランナーは無料 (create-new-app skill Phase 6)
  build-ios:
    runs-on: macos-26
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        persist-credentials: false
    - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
      with:
        channel: stable
        flutter-version: ${{ env.FLUTTER_VERSION }}
    - run: flutter pub get
    - run: flutter build ios --simulator --debug
